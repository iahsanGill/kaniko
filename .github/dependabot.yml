version: 2
# Dependabot configuration for tatara.
#
# Aggressive weekly version-bump PRs across go modules + GitHub Actions +
# Docker created constant churn against an unstable baseline. Until the CI
# matrix is steady we batch non-security bumps into one PR per ecosystem
# per month. Dependabot will still file security-only updates immediately
# regardless of these schedules — see
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      gha:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
