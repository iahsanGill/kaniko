name: Build images

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  packages: write   # Push to ghcr.io under the same repo owner.
  id-token: write   # For future cosign keyless signing.

jobs:
  build-images:
    concurrency:
      group: build-images-${{ matrix.image }}-${{ github.head_ref || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - executor
          - executor-debug
          - executor-slim
          - warmer
        include:
          - image: executor
            target: kaniko-executor
            platforms: linux/amd64,linux/arm64
            image-name: ghcr.io/iahsangill/tatara-executor
            release-tag: latest
          - image: executor-debug
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64
            image-name: ghcr.io/iahsangill/tatara-executor
            release-tag: debug
          - image: executor-slim
            target: kaniko-slim
            platforms: linux/amd64,linux/arm64
            image-name: ghcr.io/iahsangill/tatara-executor
            release-tag: slim
          - image: warmer
            target: kaniko-warmer
            platforms: linux/amd64,linux/arm64
            image-name: ghcr.io/iahsangill/tatara-warmer
            release-tag: latest

    steps:
      - uses: actions/checkout@b0e28b5ac45a892f91e7d036f8200cf5ed489415 # v3

      # Determine the tag to use. Push events get the commit SHA + any
      # qualifier; PR events build only and aren't tagged.
      - id: meta
        run: |
          event="${{ github.event_name }}"
          if [[ "${{ matrix.release-tag }}" == "latest" ]]; then
            qualifier=""
          else
            qualifier="-${{ matrix.release-tag }}"
          fi
          echo "sha-tag=${{ github.sha }}${qualifier}" >> $GITHUB_OUTPUT
          if [[ "$event" == "pull_request" ]]; then
            # PRs build for amd64 only to save CI time.
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=${{ matrix.platforms }}" >> $GITHUB_OUTPUT
          fi

      # Auth to ghcr.io with GITHUB_TOKEN (only on non-PR events; PRs can't push).
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@5927c834f5b4fdf503fca6f4c7eccda82949e1ee # v3.1.0
        with:
          platforms: ${{ matrix.platforms }}
      - uses: docker/setup-buildx-action@4fd812986e6c8c2a69e18311145f9371337f27d4 # v1
      - uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        id: build-and-push
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.image-name }}:${{ steps.meta.outputs.sha-tag }}
          no-cache-filters: certs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}

      # On tag pushes, apply release tags (:latest, :debug, :slim, :vX.Y.Z, :vX.Y.Z-debug, ...)
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Apply release tags
        run: |
          tag=${GITHUB_REF/refs\/tags\//}
          src="${{ matrix.image-name }}@${{ steps.build-and-push.outputs.digest }}"

          # :latest (or :debug, :slim)
          crane cp "$src" "${{ matrix.image-name }}:${{ matrix.release-tag }}"

          # Version-tagged variants
          if [[ "${{ matrix.release-tag }}" == "latest" ]]; then
            crane cp "$src" "${{ matrix.image-name }}:${tag}"
          else
            crane cp "$src" "${{ matrix.image-name }}:${tag}-${{ matrix.release-tag }}"
          fi
